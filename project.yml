name: Ntfy
options:
  bundleIdPrefix: me.4vr
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Your 10-character Apple Developer team ID; required for push, app groups and device builds
    DEVELOPMENT_TEAM: 2NDDPG5773
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_BUNDLE_ID: me.4vr.ntfy
    APP_GROUP: group.me.4vr.ntfy
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      PUSH_ENVIRONMENT: sandbox
      APS_ENVIRONMENT: development
    Release:
      PUSH_ENVIRONMENT: production
      APS_ENVIRONMENT: production

packages:
  NtfyKit:
    path: Packages/NtfyKit

targets:
  Ntfy:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NtfyKit
      - target: NotificationService
      - target: NtfyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ntfy
        NtfyAppGroup: $(APP_GROUP)
        NtfyPushEnvironment: $(PUSH_ENVIRONMENT)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Ntfy.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups: [$(APP_GROUP)]
        com.apple.developer.usernotifications.time-sensitive: true

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    dependencies:
      - package: NtfyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: ntfy Notifications
        NtfyAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]

  NtfyWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
    dependencies:
      - package: NtfyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: ntfy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: ntfy
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)

schemes:
  Ntfy:
    build:
      targets:
        Ntfy: all
    test:
      targets:
        - package: NtfyKit/NtfyKitTests
